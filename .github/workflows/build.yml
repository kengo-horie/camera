name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Create project
        run: |
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Camera"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.0" apply false
              id("org.jetbrains.kotlin.android") version "2.0.20" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.20" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          kotlin.daemon.jvmargs=-Xmx2g
          EOF
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
              namespace = "com.example.camera"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.example.camera"
                  minSdk = 29
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation(platform("androidx.compose:compose-bom:2024.09.03"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              val camerax = "1.4.0"
              implementation("androidx.camera:camera-core:$camerax")
              implementation("androidx.camera:camera-camera2:$camerax")
              implementation("androidx.camera:camera-lifecycle:$camerax")
              implementation("androidx.camera:camera-view:$camerax")
          }
          EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <application
                  android:label="カメラ"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          mkdir -p app/src/main/java/com/example/camera
          cat > app/src/main/java/com/example/camera/MainActivity.kt <<'EOF'
          package com.example.camera

          import android.Manifest
          import android.annotation.SuppressLint
          import android.content.ContentValues
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Bundle
          import android.provider.MediaStore
          import android.util.Size
          import android.view.ScaleGestureDetector
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.camera.core.*
          import androidx.camera.core.resolutionselector.AspectRatioStrategy
          import androidx.camera.core.resolutionselector.ResolutionSelector
          import androidx.camera.core.resolutionselector.ResolutionStrategy
          import androidx.camera.lifecycle.ProcessCameraProvider
          import androidx.camera.view.PreviewView
          import androidx.compose.foundation.Image
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.asImageBitmap
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.platform.LocalLifecycleOwner
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.viewinterop.AndroidView
          import androidx.core.content.ContextCompat

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent { MaterialTheme(colorScheme = darkColorScheme()) { Root() } }
              }
          }

          @Composable
          fun Root() {
              val ctx = LocalContext.current
              var granted by remember {
                  mutableStateOf(ContextCompat.checkSelfPermission(ctx, Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED)
              }
              val launcher = rememberLauncherForActivityResult(ActivityResultContracts.RequestPermission()) { granted = it }
              LaunchedEffect(Unit) { if (!granted) launcher.launch(Manifest.permission.CAMERA) }
              if (granted) CameraScreen() else Box(Modifier.fillMaxSize().background(Color.Black), Alignment.Center) {
                  Button(onClick = { launcher.launch(Manifest.permission.CAMERA) }) { Text("カメラを許可する") }
              }
          }

          // 4:3 の最高解像度で撮影する設定
          private fun highQualitySelector() = ResolutionSelector.Builder()
              .setAspectRatioStrategy(AspectRatioStrategy.RATIO_4_3_FALLBACK_AUTO_STRATEGY)
              .setResolutionStrategy(ResolutionStrategy.HIGHEST_AVAILABLE_STRATEGY)
              .setAllowedResolutionMode(ResolutionSelector.PREFER_HIGHER_RESOLUTION_OVER_CAPTURE_RATE)
              .build()

          @SuppressLint("ClickableViewAccessibility")
          @Composable
          fun CameraScreen() {
              val ctx = LocalContext.current
              val owner = LocalLifecycleOwner.current
              var front by remember { mutableStateOf(false) }
              var flash by remember { mutableStateOf(false) }
              var last by remember { mutableStateOf<Uri?>(null) }
              var camera by remember { mutableStateOf<Camera?>(null) }
              var zoom by remember { mutableFloatStateOf(1f) }

              val previewView = remember { PreviewView(ctx) }
              val capture = remember {
                  ImageCapture.Builder()
                      .setCaptureMode(ImageCapture.CAPTURE_MODE_MAXIMIZE_QUALITY)
                      .setJpegQuality(100)
                      .setResolutionSelector(highQualitySelector())
                      .build()
              }
              capture.flashMode = if (flash) ImageCapture.FLASH_MODE_ON else ImageCapture.FLASH_MODE_OFF

              fun setZoom(r: Float) {
                  val cam = camera ?: return
                  val zs = cam.cameraInfo.zoomState.value ?: return
                  val v = r.coerceIn(zs.minZoomRatio, zs.maxZoomRatio)
                  cam.cameraControl.setZoomRatio(v)
                  zoom = v
              }

              LaunchedEffect(front) {
                  zoom = 1f
                  val future = ProcessCameraProvider.getInstance(ctx)
                  future.addListener({
                      val provider = future.get()
                      val preview = Preview.Builder()
                          .setResolutionSelector(highQualitySelector())
                          .build().also { it.setSurfaceProvider(previewView.surfaceProvider) }
                      val selector = if (front) CameraSelector.DEFAULT_FRONT_CAMERA else CameraSelector.DEFAULT_BACK_CAMERA
                      provider.unbindAll()
                      camera = provider.bindToLifecycle(owner, selector, preview, capture)
                  }, ContextCompat.getMainExecutor(ctx))
              }

              val thumb = remember(last) {
                  last?.let { runCatching { ctx.contentResolver.loadThumbnail(it, Size(160, 160), null) }.getOrNull() }
              }

              Column(Modifier.fillMaxSize().background(Color.Black).statusBarsPadding().navigationBarsPadding()) {
                  Box(Modifier.weight(1f).fillMaxWidth(), Alignment.Center) {
                      // 画面の 4:3 の範囲がそのまま写真になります
                      Box(Modifier.fillMaxWidth().aspectRatio(3f / 4f).clip(RoundedCornerShape(16.dp))) {
                          AndroidView(
                              factory = {
                                  val detector = ScaleGestureDetector(ctx, object : ScaleGestureDetector.SimpleOnScaleGestureListener() {
                                      override fun onScale(d: ScaleGestureDetector): Boolean {
                                          setZoom(zoom * d.scaleFactor); return true
                                      }
                                  })
                                  previewView.setOnTouchListener { _, e -> detector.onTouchEvent(e); true }
                                  previewView
                              },
                              modifier = Modifier.fillMaxSize()
                          )
                          Text(
                              "%.1f×".format(zoom), color = Color.White,
                              modifier = Modifier.align(Alignment.TopStart).padding(10.dp)
                                  .background(Color(0x99000000), CircleShape).padding(horizontal = 12.dp, vertical = 6.dp)
                          )
                          TextButton(
                              onClick = { flash = !flash },
                              modifier = Modifier.align(Alignment.TopEnd).padding(6.dp).background(Color(0x99000000), CircleShape)
                          ) { Text(if (flash) "フラッシュ オン" else "フラッシュ オフ", color = Color.White) }
                          Row(
                              Modifier.align(Alignment.BottomCenter).padding(10.dp),
                              horizontalArrangement = Arrangement.spacedBy(8.dp)
                          ) {
                              listOf(1f, 2f, 5f).forEach { z ->
                                  TextButton(
                                      onClick = { setZoom(z) },
                                      modifier = Modifier.background(if (zoom == z) Color(0xFF6FB3FF) else Color(0x99000000), CircleShape)
                                  ) { Text("${z.toInt()}×", color = if (zoom == z) Color(0xFF06121F) else Color.White) }
                              }
                          }
                      }
                  }
                  Row(Modifier.fillMaxWidth().padding(horizontal = 28.dp, vertical = 18.dp), Arrangement.SpaceBetween, Alignment.CenterVertically) {
                      Box(
                          Modifier.size(56.dp).clip(RoundedCornerShape(12.dp)).background(Color(0xFF1B2026))
                              .clickable(enabled = last != null) {
                                  ctx.startActivity(Intent(Intent.ACTION_VIEW).setDataAndType(last, "image/jpeg").addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION))
                              }
                      ) { thumb?.let { Image(it.asImageBitmap(), "最後に撮った写真", Modifier.fillMaxSize(), contentScale = ContentScale.Crop) } }

                      Box(
                          Modifier.size(76.dp).border(4.dp, Color.White, CircleShape).padding(6.dp).clip(CircleShape).background(Color.White)
                              .clickable { shoot(ctx, capture) { last = it } }
                      )

                      TextButton(onClick = { front = !front }, Modifier.size(56.dp).background(Color(0xFF1B2026), CircleShape)) {
                          Text("切替", color = Color.White)
                      }
                  }
              }
          }

          fun shoot(ctx: android.content.Context, capture: ImageCapture, onSaved: (Uri) -> Unit) {
              val values = ContentValues().apply {
                  put(MediaStore.Images.Media.DISPLAY_NAME, "IMG_${System.currentTimeMillis()}")
                  put(MediaStore.Images.Media.MIME_TYPE, "image/jpeg")
                  put(MediaStore.Images.Media.RELATIVE_PATH, "Pictures/Camera")
              }
              val options = ImageCapture.OutputFileOptions.Builder(
                  ctx.contentResolver, MediaStore.Images.Media.EXTERNAL_CONTENT_URI, values
              ).build()
              capture.takePicture(options, ContextCompat.getMainExecutor(ctx), object : ImageCapture.OnImageSavedCallback {
                  override fun onImageSaved(result: ImageCapture.OutputFileResults) { result.savedUri?.let(onSaved) }
                  override fun onError(e: ImageCaptureException) {
                      Toast.makeText(ctx, "撮影に失敗しました", Toast.LENGTH_SHORT).show()
                  }
              })
          }
          EOF
      - name: Build
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: camera-apk
          path: app/build/outputs/apk/debug/app-debug.apk
